<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cupola">
  <title>Cupola</title>
  <style>
    .glow { transform-origin: 100px 90px; animation: cupola-breathe 3.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
    @keyframes cupola-breathe {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50%      { opacity: 0.72; transform: scale(1.12); }
    }
  </style>
  <defs>
    <radialGradient id="bgGradFav" cx="50%" cy="58%" r="75%">
      <stop offset="0%" stop-color="#221c29"/>
      <stop offset="100%" stop-color="#100d15"/>
    </radialGradient>
    <filter id="glowBlurFav" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="46" fill="url(#bgGradFav)"/>

  <ellipse class="glow" cx="100" cy="90" rx="30" ry="16" fill="#ffc94a" opacity="0.55" filter="url(#glowBlurFav)"/>

  <polygon points="50,154 150,154 128,134 72,134" fill="#6f6579"/>

  <rect x="72" y="94" width="56" height="42" rx="6" fill="#ffc94a" stroke="#9a90a6" stroke-width="5"/>

  <path d="M72,96 A28,34 0 0 1 128,96 Z" fill="#9a90a6"/>

  <line x1="100" y1="66" x2="100" y2="80" stroke="#9a90a6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="60" r="8" fill="#ffc94a"/>
</svg>
